<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>logProgress</title>
<!-- Favicon -->
    <link rel="shortcut icon" href="img/logo.png">   

<style>
        body {
            background: #0d1117;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        .cards-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .card {
            background: rgba(22, 27, 34, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 2rem;
            flex: 1;
            max-width: 400px;
            border: 1px solid rgba(48, 54, 61, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(88, 166, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(88, 166, 255, 0.1);
        }

        h1 {
            font-size: 9rem;
            margin: 0;
            padding: 10px;
            background: linear-gradient(45deg, #64c3ff, #f77bfc, #7ee787);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 6s ease infinite;
            background-size: 200% 200%;
        }

        h2 {
            font-size: 2rem;
            margin: 0;
            padding: 10px;
            
        }

        p {
            font-size: 1rem;
            margin: 1rem 0;
        }

        /* Base button styles */
        a {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid rgba(240, 246, 252, 0.1);
            margin-top: 1rem;
        }

        /* Download button - Green */
        .card:first-child a {
            background: linear-gradient(45deg, #238636, #2ea043);
        }

        .card:first-child a:hover {
            background: linear-gradient(45deg, #2ea043, #3fb950);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(46, 160, 67, 0.2);
        }

        /* GitHub button - Blue */
        .card:last-child a {
            background: linear-gradient(45deg, #1158c7, #0969da);
        }

        .card:last-child a:hover {
            background: linear-gradient(45deg, #0969da, #1f6feb);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(9, 105, 218, 0.2);
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Add a subtle glow effect behind the cards */
        .cards-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(88, 166, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 4rem;
            }
            
            .container {
                padding: 1rem;
                margin: 1rem;
            }

            .cards-container {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .card {
                width: 100%;
                max-width: none;
                padding: 1.5rem;
            }

            body {
                height: auto;
                overflow-y: auto;
                padding: 2rem 0;
            }
        }

        @media (max-width: 380px) {
            h1 {
                font-size: 3rem;
            }

            .card {
                padding: 1rem;
            }

            p {
                font-size: 0.9rem;
            }

            a {
                padding: 0.5rem 1rem;
            }
        }
    </style>
</head>
<body>
  <div id="root"></div>
    <div class="container">
        <h1>logProgress</h1>
        <h2><strong>Open-Source Activity & Goal Tracker App</strong></h2>
        <div class="cards-container">
            <div class="card">
                <p>Track progress and achieve your goals.<br>Your data is stored locally on your device.</p>
                <a href="/">Download V 1.0.0</a>
            </div>
            <div class="card">
                <p>Now open-source. Git it!<br>Let's build and improve it together!</p>
                <a href="/">Go to GitHub</a>
            </div>
        </div>
    </div>
    <div class="stars"></div>

    <script>
        function createStar() {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = '2px';
            star.style.height = '2px';
            star.style.background = '#ffffff';
            star.style.borderRadius = '50%';
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animation = `twinkle ${Math.random() * 5 + 3}s linear infinite`;
            return star;
        }

        const starsContainer = document.querySelector('.stars');
        for (let i = 0; i < 100; i++) {
            starsContainer.appendChild(createStar());
        }
    </script>

</body>
</html>
